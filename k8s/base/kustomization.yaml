apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources in the base layer.
# Environment-specific overlays (staging, production) can patch these.
resources:
  # Frontend
  - nautos-app/configmap.yaml
  - nautos-app/deployment.yaml
  - nautos-app/service.yaml
  # Worker API + Celery
  - nautos-worker/configmap.yaml
  - nautos-worker/deployment.yaml
  - nautos-worker/celery-deployment.yaml
  - nautos-worker/service.yaml

# Common labels applied to every resource
commonLabels:
  project: nautos
  managed-by: kustomize
