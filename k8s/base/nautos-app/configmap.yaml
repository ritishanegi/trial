apiVersion: v1
kind: ConfigMap
metadata:
  name: nautos-app-config
  labels:
    app: nautos-app
    component: frontend
data:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  # Override these in environment-specific overlays (e.g., k8s/overlays/staging/)
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  WORKER_API_URL: "http://nautos-worker:8000"
