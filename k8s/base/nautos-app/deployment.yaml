apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautos-app
  labels:
    app: nautos-app
    component: frontend
    version: "1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nautos-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nautos-app
        component: frontend
    spec:
      containers:
        - name: nautos-app
          image: ghcr.io/your-org/nautos-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nautos-app-config
          env:
            # Sensitive values — reference from a Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nautos-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: nautos-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
