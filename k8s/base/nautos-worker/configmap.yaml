apiVersion: v1
kind: ConfigMap
metadata:
  name: nautos-worker-config
  labels:
    app: nautos-worker
    component: api
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  # Override in environment-specific overlays
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  AZURE_DI_ENDPOINT: "https://your-resource.cognitiveservices.azure.com/"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "nautos-documents"
