[mypy]
# ── Global settings ───────────────────────────────────────────────────────────
python_version = 3.12
strict = True

# Make errors more actionable
show_error_codes = True
show_column_numbers = True
pretty = True

# Error reporting
error_summary = True

# Warn on unused ignores so stale "# type: ignore" comments don't accumulate
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True

# ── Third-party packages without complete type stubs ─────────────────────────
# These packages either have no stubs or have incomplete stubs — suppress
# missing-import errors on a per-package basis rather than globally.

[mypy-azure.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-groq.*]
ignore_missing_imports = True

[mypy-voyageai.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-psycopg.*]
ignore_missing_imports = True

[mypy-psycopg_pool.*]
ignore_missing_imports = True

[mypy-pgvector.*]
ignore_missing_imports = True

[mypy-elasticsearch.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-kombu.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

# ── Test files — relax strict checks ─────────────────────────────────────────
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# ── Alembic migrations — auto-generated, don't enforce strict types ───────────
[mypy-alembic.*]
ignore_errors = True
