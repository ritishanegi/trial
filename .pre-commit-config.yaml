# .pre-commit-config.yaml
# Runs on every `git commit` to enforce code quality and security standards
# across both the Next.js app and the Python worker.
#
# Setup:
#   pip install pre-commit detect-secrets
#   pre-commit install
#   pre-commit run --all-files  # first-time baseline check
#
# Update hooks:
#   pre-commit autoupdate

default_language_version:
  python: python3.12
  node: "22"

# Only run on changed files by default; CI runs --all-files
default_stages: [pre-commit]

repos:
  # ── 1. Universal file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]          # allow custom YAML tags (e.g. !reference in GitLab CI)
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]      # block files > 1 MB accidentally committed
      - id: no-commit-to-branch
        args: [--branch, main, --branch, production]
      - id: mixed-line-ending
        args: [--fix=lf]

  # ── 2. Secret scanning (detect-secrets) ───────────────────────────────────
  # Uses a baseline file (.secrets.baseline) so known false-positives are
  # acknowledged and only NEW secrets block commits.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "🔐 Secret scan (detect-secrets)"
        args:
          - --baseline
          - .secrets.baseline
          # Exclude test fixtures and example files that contain dummy values
          - --exclude-files
          - \.env\.example$
          - --exclude-files
          - tests/.*
          - --exclude-files
          - alembic/versions/.*
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            pnpm-lock\.yaml|
            uv\.lock
          )$

  # ── 3. Python — Ruff linter (nautos-worker) ────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        name: "🐍 Ruff lint"
        args: [--fix, --exit-non-zero-on-fix]
        files: ^nautos-worker/
        types_or: [python, pyi]

      - id: ruff-format
        name: "🐍 Ruff format"
        files: ^nautos-worker/
        types_or: [python, pyi]

  # ── 4. Python — Mypy type-checker (nautos-worker) ─────────────────────────
  - repo: local
    hooks:
      - id: mypy-worker
        name: "🐍 Mypy type-check (nautos-worker)"
        language: system
        entry: bash -c 'cd nautos-worker && uv run mypy app/'
        files: ^nautos-worker/app/.*\.py$
        pass_filenames: false
        stages: [pre-commit]

  # ── 5. TypeScript / JS — Prettier formatter (nautos-app) ──────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: "✨ Prettier format (nautos-app)"
        files: ^nautos-app/
        types_or: [ts, tsx, javascript, jsx, json, css, markdown, yaml]
        exclude: |
          (?x)^(
            nautos-app/pnpm-lock\.yaml|
            nautos-app/\.next/.*|
            nautos-app/node_modules/.*|
            nautos-app/playwright-report/.*
          )$
        additional_dependencies:
          - prettier@3.4.0

  # ── 6. Commit message format ───────────────────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        name: "📝 Commit message (Conventional Commits)"
        stages: [commit-msg]
