name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Next.js Frontend — lint, type-check, test, E2E
  # ──────────────────────────────────────────────
  lint-and-test-app:
    name: "Frontend — Lint, Type-Check & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nautos-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: nautos-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type-check
        run: pnpm exec tsc --noEmit

      - name: Run unit tests (Vitest)
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: pnpm exec playwright test --reporter=list
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nautos-app/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2: Python Worker — lint, type-check, test
  # ──────────────────────────────────────────────
  lint-and-test-worker:
    name: "Worker — Ruff, Mypy & Pytest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nautos-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "nautos-worker/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (including dev extras)
        run: uv sync --extra dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run Mypy type-checker
        run: uv run mypy app/

      - name: Run Pytest
        run: uv run pytest tests/ -v --tb=short
        env:
          # Provide dummy values so config/settings can be imported without a real DB
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          ELASTICSEARCH_URL: "http://localhost:9200"
          AZURE_DI_ENDPOINT: "https://dummy.cognitiveservices.azure.com/"
          AZURE_DI_KEY: "dummy-key"
          ANTHROPIC_API_KEY: "sk-dummy"
          VOYAGE_API_KEY: "dummy"
          AWS_ACCESS_KEY_ID: "dummy"
          AWS_SECRET_ACCESS_KEY: "dummy"
          AWS_S3_BUCKET: "dummy-bucket"
          AWS_REGION: "us-east-1"
