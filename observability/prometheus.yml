# observability/prometheus.yml
# Prometheus scrape configuration for the nautos stack.
#
# Reload without restart (after config change):
#   curl -X POST http://localhost:9090/-/reload

global:
  scrape_interval: 15s          # Default pull frequency
  evaluation_interval: 15s      # How often to evaluate alerting rules
  scrape_timeout: 10s

  # Labels attached to every time-series scraped by this Prometheus instance
  external_labels:
    project: "nautos"
    environment: "local"

# ── Alerting rules ─────────────────────────────────────────────────────────
rule_files:
  - "alerts/*.yml"              # Place alert rule files here (future)

# ── Scrape configurations ─────────────────────────────────────────────────
scrape_configs:

  # ── Prometheus self-monitoring ─────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── nautos-worker FastAPI API ──────────────────────────────────────────
  # Metrics exposed by prometheus-fastapi-instrumentator at /metrics.
  # Provides: HTTP request count, latency histograms, in-progress requests.
  - job_name: "nautos-worker-api"
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-api:8000"]
        labels:
          service: "worker-api"
          component: "fastapi"

  # ── Celery Flower Prometheus exporter ─────────────────────────────────
  # Flower exposes Celery task metrics at /metrics:
  #   flower_events_total, flower_task_runtime_seconds, flower_workers_online, etc.
  - job_name: "celery-flower"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
        labels:
          service: "celery"
          component: "flower"

  # ── Next.js app (custom /api/metrics endpoint) ────────────────────────
  # The nautos-app exposes a lightweight prom-client metrics route.
  # See: nautos-app/src/app/api/metrics/route.ts
  - job_name: "nautos-app"
    scrape_interval: 30s        # Slower — frontend metrics change less frequently
    metrics_path: /api/metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          service: "nautos-app"
          component: "nextjs"
