apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Enable Prometheus alertmanager integration
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "3.4.0"
      # Cache duration for query results in the Explore view
      cacheLevel: "Low"
      # Disable metrics browser for performance
      disableMetricsLookup: false
      # Exemplar tracing — link Prometheus traces to Sentry/Jaeger
      exemplarTraceIdDestinations:
        - name: sentry_trace_id
          datasourceUid: ""
          urlDisplayLabel: "View in Sentry"
